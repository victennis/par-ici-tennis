name: Tennis booking

on:
  schedule:
    # Se déclenche à 7h45 (marge de sécurité), uniquement le samedi (6).
    # samedi -> vise le vendredi soir suivant (recherche 6 jours à l'avance)
    - cron: '45 7 * * 6'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  book_19h:
    name: Réservation 19h
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create config.json (19h)
        env:
          CONFIG_JSON: ${{ vars.CONFIG_JSON_19H }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG_JSON:-}" ]; then
            printf "%s" "$CONFIG_JSON" > config.json
          else
            echo "ERROR: variable CONFIG_JSON_19H manquante." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --production --ignore-scripts

      - name: Cache Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser (only-shell)
        run: npx playwright install chromium --only-shell

      - name: Run script
        env:
          ACCOUNT_EMAIL: ${{ secrets.ACCOUNT_EMAIL }}
          ACCOUNT_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_DOMAIN: ${{ secrets.NTFY_DOMAIN }}
          WAIT_FOR_8AM: ${{ github.event_name == 'schedule' }}
        run: npm start
